# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: transcendence
type: Opaque
stringData:
  # Postgres (consumed by the backend and by the postgres deployment)
  POSTGRES_USER: "test"
  POSTGRES_PASSWORD: "test"
  POSTGRES_DB: "test"
  DATABASE_URL: "postgres://test:test@backend-postgress:5432/test"

  # Redis
  REDIS_URL: "redis://backend-redis:6379"

  # TigerBeetle lives in the `tigerbeetle` namespace and its client needs IPs.
  # TB_HOSTS holds DNS names; the backend deployment resolves them into
  # TB_IP_ADRESSES at container start.
  TB_CLUSTER_ID: "0"
  TB_HOSTS: "tb-node-0.tigerbeetle.svc.cluster.local:3000,tb-node-1.tigerbeetle.svc.cluster.local:3000,tb-node-2.tigerbeetle.svc.cluster.local:3000"
