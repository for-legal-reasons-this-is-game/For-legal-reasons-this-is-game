# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: transcendence
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend_trading_engine:latest
          resources:
            requests:
              cpu: 200m
              memory: 50Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 500Mi
              ephemeral-storage: 500Mi

      automountServiceAccountToken: false
