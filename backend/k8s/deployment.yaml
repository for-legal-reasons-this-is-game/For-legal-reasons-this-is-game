apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: transcendence
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend_trading_engine:latest
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
              ephemeral-storage: 500Mi
