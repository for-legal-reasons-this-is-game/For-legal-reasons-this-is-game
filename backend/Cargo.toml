[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
cn-tigerbeetle = "0.1.2"
hex = "0.4.3"
hmac = "0.13.0"
num-derive = "0.5.1"
num-traits = "0.2.19"
prost = "0.14.4"
rust_decimal = {version = "1.43.0", features = ["serde-str"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid"] }
tokio = { version = "1.53.0", features = ["full"] }
tonic = "0.14.6"
uuid = { version = "1.24.0", features = ["serde"] }

[build-dependencies]
tonic-build = "0.14.6"

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1.24.0", features = ["v4"] }
