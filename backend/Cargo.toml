[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
cn-tigerbeetle = "0.1.2"
hex = "0.4.3"
hmac = "0.13.0"
num-derive = "0.5.1"
num-traits = "0.2.19"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha256 = "1.6.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid"] }
tokio = { version = "1.53.0", features = ["full"] }
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1.24.0", features = ["v4"] }
