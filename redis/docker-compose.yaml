version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # For local dev, we turn on persistence (AOF) so your sessions 
    # survive container restarts
    command: ["redis-server", "--appendonly", "yes"]

  # OPTIONAL: A nice UI to inspect your sessions and JWT keys visually
  redis-insight:
    image: redis/redisinsight:latest
    container_name: local-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis_data:
