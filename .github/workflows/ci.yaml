name: CI

on:
  pull_request:
    branches: [main, database]
  push:
    branches: [main, database]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, tradingengine] 
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: cargo build
        working-directory: ${{ matrix.dir }}
        run: nix develop --command cargo build --locked --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, tradingengine]
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: cargo test
        working-directory: ${{ matrix.dir }}
        run: nix develop --command cargo test --locked --bins

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      # scripts/integration-test.sh brings up throwaway Postgres + TigerBeetle
      # containers, boots the backend against them, runs the suite, and tears
      # it all down (dumping container/server logs on failure).
      - name: integration tests
        working-directory: backend
        run: nix develop --command bash scripts/integration-test.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, tradingengine]
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: cargo clippy
        working-directory: ${{ matrix.dir }}
        run: nix develop --command cargo clippy --locked --all-targets -- -D warnings

  # proto is a library with no flake of its own, so it borrows the engine's
  # devShell (which has protoc). Its tests never run from the backend/engine
  # jobs: cargo test only runs the tests of the crate it's invoked in.
  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: cargo test
        working-directory: proto
        run: nix develop ../tradingengine --command cargo test --locked
      - name: cargo clippy
        working-directory: proto
        run: nix develop ../tradingengine --command cargo clippy --locked --all-targets -- -D warnings
