# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: tigerbeetle
spec:
  serviceName: "tb-node-0"
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tigerbeetle
  template:
    metadata:
      labels:
        app: tigerbeetle
    spec:
      initContainers:
        - name: format-data-file
          image: ghcr.io/tigerbeetle/tigerbeetle:latest
          securityContext:
            seccompProfile:
              type: Unconfined
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
              DATA_FILE="/var/lib/tigerbeetle/cluster_0_${REPLICA_INDEX}.tigerbeetle"

              sleep $((5 * REPLICA_INDEX))
              if [ ! -f "${DATA_FILE}" ]; then
                /tigerbeetle format \
                  --cluster=0 \
                  --replica="${REPLICA_INDEX}" \
                  --replica-count=3 \
                  --development \
                  "${DATA_FILE}"
              fi
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: tb-data
              mountPath: /var/lib/tigerbeetle
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:latest
          securityContext:
            seccompProfile:
              type: Unconfined
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              REPLICA_INDEX=$(echo "${HOSTNAME}" | awk -F'-' '{print $NF}')
              DATA_FILE="/var/lib/tigerbeetle/cluster_0_${REPLICA_INDEX}.tigerbeetle"

              # Kubernetes automatically injects TB_NODE_X_SERVICE_HOST with the static IPv4 of each Service!
              # A replica cannot bind to its own Service ClusterIP (not assigned to the pod),
              # so use 0.0.0.0 for our own slot and the Service IPs for the peers.
              A0="${TB_NODE_0_SERVICE_HOST}:3000"
              A1="${TB_NODE_1_SERVICE_HOST}:3000"
              A2="${TB_NODE_2_SERVICE_HOST}:3000"
              case "${REPLICA_INDEX}" in
                0) A0="0.0.0.0:3000" ;;
                1) A1="0.0.0.0:3000" ;;
                2) A2="0.0.0.0:3000" ;;
              esac
              ADDRESSES="${A0},${A1},${A2}"
              echo "Starting replica ${REPLICA_INDEX} with static IPs: ${ADDRESSES}"

              exec /tigerbeetle start \
                --addresses="${ADDRESSES}" \
                --cache-grid=512MiB \
                --development \
                "${DATA_FILE}"
          ports:
            - containerPort: 3000
              name: peer
          resources:
            requests:
              cpu: "50m"
              memory: "1500Mi"
            limits:
              cpu: "500m"
              memory: "2Gi"
          volumeMounts:
            - name: tb-data
              mountPath: /var/lib/tigerbeetle
  volumeClaimTemplates:
    - metadata:
        name: tb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
