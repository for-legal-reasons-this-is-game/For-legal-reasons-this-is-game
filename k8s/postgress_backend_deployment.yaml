# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-postgress
  namespace: transcendence
  labels:
    app: backend-postgress

spec:
  selector:
    matchLabels:
      app: backend-postgress
  template:
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: storage

          resources:
            limits:
              cpu: 500m
              memory: 500Mi
              ephemeral-storage: 500Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: postgres-backend-pvc
    metadata:
      labels:
        app: backend-postgress

  replicas: 1
