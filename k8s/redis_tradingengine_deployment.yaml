# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingengine-redis
  namespace: transcendence
  labels:
    app: tradingengine-redis

spec:
  selector:
    matchLabels:
      app: tradingengine-redis
  template:
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          args:
            - redis-server
            - --appendonly
            - "yes"

          volumeMounts:
            - mountPath: /data
              name: storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: redis-tradingengine-pvc
    metadata:
      labels:
        app: tradingengine-redis

  replicas: 1
