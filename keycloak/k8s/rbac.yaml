# Keycloak's distributed cache (Infinispan) discovers its cluster peers via
# KUBE_PING, which queries the Kubernetes API for sibling pods. This is the
# RBAC that grants it permission to do that within its own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-kube-ping
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-kube-ping
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: keycloak
    namespace: keycloak
roleRef:
  kind: Role
  name: keycloak-kube-ping
  apiGroup: rbac.authorization.k8s.io
