# Placeholder credentials. Do NOT commit real values here.
# In a real deployment, replace this file's usage with a secret manager
# (sealed-secrets, external-secrets + Vault/SSM, SOPS, etc.) so plaintext
# secrets never land in git. This file exists so `kubectl apply -k` works
# out of the box for a first deploy.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-credentials
  namespace: keycloak
type: Opaque
stringData:
  POSTGRES_USER: keycloak
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: keycloak
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
