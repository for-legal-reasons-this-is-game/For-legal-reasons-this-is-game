[package]
name = "tradingengine"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = {version = "0.14.6", features = ["transport"] }
tokio = { version = "1.53.0", features = ["full"] }
tokio-stream = "0.1.19"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
proto = {path = "../proto"}
primitive-types = { version = "0.14.0", default-features = false }
# the engine's state in Redis (src/store.rs), with the same versions the backend uses
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
