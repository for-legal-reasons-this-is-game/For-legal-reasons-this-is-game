[package]
name = "tradingengine"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = {version = "0.14.6", features = ["transport"] }
tokio = { version = "1.53.0", features = ["full"] }
tokio-stream = "0.1.19"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
proto = {path = "../proto"}
primitive-types = { version = "0.14.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
prost = "0.14.6"
rmp-serde = "1.3.1"
redis = { version = "1.8.1", features = ["connection-manager", "tokio-comp"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
