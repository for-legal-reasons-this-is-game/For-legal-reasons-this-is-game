server {
    listen       82;
    server_name  localhost;

    location / {
        root        /dist;
        index       index.html index.htm;
        try_files   $uri /index.html;
    }

    # With a variable, nginx can’t know the address until a request comes
    # in, so it looks the name up on each request. For lookups at that point
    # nginx doesn’t use the system DNS settings; it only uses a DNS server
    # you name with resolver
    resolver 127.0.0.11 valid=10s;   # Docker's internal DNS
    location /api/ {
        # with a plain hostname (procy_pass http://backend:8000), nginx
        # refuses to start if $backend is not resolved (because backend
        # service wasn't started yet)
        set         $backend http://backend:8000;
        proxy_pass  $backend;
        # to make /api always answer in json. useful when calling api with curl
        error_page  502 503 504 = @api_down;
    }

    location @api_down {
        default_type    application/json;
        return 502 '{"error":"backend unavailable"}';
    }
}
